<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDT 转账</title>
    <style>
        :root {
            --bg-color: #f2f3f5; /* 整体背景灰 */
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-sub: #888888;
            --primary-blue: #b3d4ff; /* 浅蓝色按钮背景 */
            --primary-blue-text: #007aff; /* 深蓝色文字 */
            --primary-blue-active: #68a8ff;
            --success-green: #34c759;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e5e5e5; /* 外围背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 模拟手机屏幕容器 */
        .app-container {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* 顶部导航栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            padding-top: 40px; /* 模拟刘海屏留白 */
        }

        .header .icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            fill: #333;
        }

        .header-title {
            text-align: center;
        }

        .header-title h1 {
            font-size: 17px;
            font-weight: 500;
            color: var(--text-main);
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* 主要内容滚动区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* 标签文字 */
        .section-label {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 收款地址卡片 */
        .address-card {
            background-color: #e5e6e8;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .address-text {
            font-size: 15px;
            color: var(--text-main);
            word-break: break-all;
            line-height: 1.4;
            padding-right: 12px;
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .copy-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--success-green);
        }

        /* 添加到地址本按钮 */
        .add-address-btn {
            background-color: #cce0ff;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .add-address-left {
            display: flex;
            align-items: center;
            color: #1a73e8;
            font-size: 15px;
            font-weight: 500;
        }

        .add-address-left svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            fill: #1a73e8;
        }

        .add-address-right svg {
            width: 16px;
            height: 16px;
            fill: #1a73e8;
        }

        /* 数量区域卡片 */
        .amount-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        /* 大号输入框 */
        .amount-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 48px;
            font-weight: 400;
            color: var(--text-main);
            background: transparent;
            margin-bottom: 20px;
            font-family: inherit;
        }

        .amount-input::placeholder {
            color: #cccccc;
        }

        /* 隐藏输入框的上下箭头 */
        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .note-text {
            font-size: 14px;
            color: var(--text-sub);
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
        }

        /* 矿工费卡片 */
        .fee-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .fee-top {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .fee-price {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .fee-dropdown {
            font-size: 14px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .fee-dropdown svg {
            width: 16px;
            height: 16px;
            margin-left: 4px;
            fill: #666;
        }

        /* 资源切换按钮 */
        .fee-toggles {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background-color: #cce0ff;
            color: #1a73e8;
            font-weight: 500;
        }

        .toggle-btn.inactive {
            background-color: #f2f3f5;
            color: var(--text-sub);
        }

        .fee-desc {
            font-size: 13px;
            color: var(--text-sub);
        }

        /* 底部按钮 */
        .footer {
            padding: 20px;
            background-color: var(--bg-color);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 18px 0;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:active {
            background-color: var(--primary-blue-active);
        }

        /* 复制成功提示 */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 头部 -->
        <header class="header">
            <!-- 返回箭头 -->
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
            </svg>
            <div class="header-title">
                <h1>USDT 转账</h1>
                <p>Tron</p>
            </div>
            <!-- 扫码图标 -->
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2zM7 7h10v10H7z"/>
            </svg>
        </header>

        <!-- 内容区 -->
        <main class="main-content">
            <!-- 收款地址 -->
            <div class="section-label">收款地址</div>
            <div class="address-card">
                <!-- 【已修改此处地址】 -->
                <div class="address-text" id="walletAddress">TP2bosCJtezY3bUTUUinChyWSVp7KpsocA</div>
                <button class="copy-btn" id="copyBtn" title="复制地址">
                    <svg viewBox="0 0 24 24">
                        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                    </svg>
                </button>
            </div>

            <!-- 添加到地址本 -->
            <div class="add-address-btn">
                <div class="add-address-left">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    添加到地址本
                </div>
                <div class="add-address-right">
                    <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                </div>
            </div>

            <!-- 数量 (自定义输入区) -->
            <div class="section-label">
                <span>数量</span>
                <span style="color: var(--text-main); font-weight: 500;">87.8985 USDT</span>
            </div>
            <div class="amount-card">
                <!-- 这里是大号输入框，用户可以输入金额 -->
                <input type="number" class="amount-input" id="amountInput" placeholder="0" autocomplete="off">
                <div class="note-text">备注 (需支付 1 TRX)</div>
            </div>

            <!-- 矿工费 -->
            <div class="section-label">矿工费</div>
            <div class="fee-card">
                <div class="fee-top">
                    <div class="fee-price">$ 0</div>
                    <div class="fee-dropdown">
                        0 TRX
                        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                    </div>
                </div>
                <div class="fee-toggles">
                    <button class="toggle-btn active" id="btnEnergy">消耗资源</button>
                    <button class="toggle-btn inactive" id="btnBurn">燃烧 TRX</button>
                </div>
                <div class="fee-desc" id="feeDesc">账户资源充足，本次转账仅消耗资源</div>
            </div>
        </main>

        <!-- 底部按钮 -->
        <footer class="footer">
            <button class="submit-btn" id="submitBtn">下一步</button>
        </footer>
    </div>

    <!-- 提示框 -->
    <div class="toast" id="toast">地址已复制</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 复制地址功能
            const copyBtn = document.getElementById('copyBtn');
            const toast = document.getElementById('toast');
            // 获取更新后的地址文本
            const walletAddress = document.getElementById('walletAddress').innerText.replace(/\n/g, ''); 

            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(walletAddress);
                    showToast('地址已复制');
                } catch (err) {
                    // 降级方案
                    const textArea = document.createElement('textarea');
                    textArea.value = walletAddress;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showToast('地址已复制');
                }
            });

            function showToast(message) {
                toast.innerText = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            // 2. 矿工费切换逻辑
            const btnEnergy = document.getElementById('btnEnergy');
            const btnBurn = document.getElementById('btnBurn');
            const feeDesc = document.getElementById('feeDesc');
            const feePrice = document.querySelector('.fee-price');
            const feeTrx = document.querySelector('.fee-dropdown');

            btnEnergy.addEventListener('click', () => {
                btnEnergy.classList.add('active');
                btnEnergy.classList.remove('inactive');
                btnBurn.classList.add('inactive');
                btnBurn.classList.remove('active');
                
                feePrice.innerText = '$ 0';
                feeTrx.innerHTML = `0 TRX <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>`;
                feeDesc.innerText = '账户资源充足，本次转账仅消耗资源';
                feeDesc.style.color = 'var(--text-sub)';
            });

            btnBurn.addEventListener('click', () => {
                btnBurn.classList.add('active');
                btnBurn.classList.remove('inactive');
                btnEnergy.classList.add('inactive');
                btnEnergy.classList.remove('active');
                
                feePrice.innerText = '$ 1.24';
                feeTrx.innerHTML = `~13.5 TRX <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>`;
                feeDesc.innerText = '当前账户无充足资源，将扣除 TRX 作为手续费';
                feeDesc.style.color = '#ff3b30'; 
            });

            // 3. 输入金额交互
            const amountInput = document.getElementById('amountInput');
            const submitBtn = document.getElementById('submitBtn');

            amountInput.addEventListener('input', function() {
                if (this.value && parseFloat(this.value) > 0) {
                    submitBtn.style.backgroundColor = '#007aff'; 
                    submitBtn.style.color = '#ffffff';
                } else {
                    submitBtn.style.backgroundColor = 'var(--primary-blue)'; 
                }
            });
        });
    </script>
</body>
</html>
